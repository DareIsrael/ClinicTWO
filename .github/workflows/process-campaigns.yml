name: Process email campaigns

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process queued email campaigns
        env:
          APP_URL: ${{ secrets.CLINIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/admin/broadcast/campaigns/process"
